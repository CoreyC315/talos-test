# In-cluster OCI registry for KubeShowcase app images.
# Why: pushing to ghcr.io needs a PAT with write:packages; this keeps the homelab self-contained.
#
# Design (hardened after repeated failures — see docs/talos-gotchas.md):
#  - Pinned to worker-1 (the aether host; nahida is chronically loaded by a co-tenant k0s VM).
#  - hostPort 5000 on worker-1's node IP 192.168.1.23 → pulls traverse the PHYSICAL LAN,
#    bypassing the Cilium pod-overlay (which degrades under nahida's CPU load) AND the
#    LB-IPAM/L2 indirection. Talos `registries.mirrors` points 192.168.1.23:5000 at plain HTTP.
#  - hostPath (not Longhorn): the registry is a rebuildable image cache; a local dir on the
#    pinned node is stable + fast and avoids Longhorn RWO reattach / engine-image races.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels: {app: registry}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1 # aether host — off congested nahida; stable node IP .23
      securityContext:
        runAsUser: 0 # privileged ns; needs to own its root-created hostPath cache dir
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: docker.io/library/registry:3.0.0
          ports:
            - {containerPort: 5000, name: http, hostPort: 5000} # node-local pulls via physical LAN
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsUser: 0
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 10
      volumes:
        - name: data
          hostPath:
            path: /var/lib/ks-registry # Talos EPHEMERAL partition — persists across reboots
            type: DirectoryOrCreate
---
# ClusterIP kept for in-cluster HTTP access (debugging); node pulls use the hostPort.
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels: {app: registry}
spec:
  selector: {app: registry}
  ports:
    - {port: 5000, targetPort: http, name: http}
