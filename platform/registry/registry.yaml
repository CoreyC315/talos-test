# In-cluster OCI registry for KubeShowcase app images (LB .28).
# Why: pushing to ghcr.io requires a PAT with write:packages; the homelab stays
# self-contained with its own registry. Talos nodes mirror 192.168.1.28:5000 -> http.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels: {app: registry}
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: registry:3.0.0
          ports:
            - {containerPort: 5000, name: http}
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/, port: http}
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels: {app: registry}
  annotations:
    lbipam.cilium.io/ips: 192.168.1.28
spec:
  type: LoadBalancer
  selector: {app: registry}
  ports:
    - {port: 5000, targetPort: http, name: http}
