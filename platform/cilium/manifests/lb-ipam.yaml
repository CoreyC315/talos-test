# Cilium LB-IPAM pool + L2 announcement policy — replaces MetalLB (never run both: ARP fights)
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-pool
spec:
  blocks:
    - start: 192.168.1.26
      stop: 192.168.1.30
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  interfaces:
    - ^ens[0-9]+ # Proxmox virtio NIC
  nodeSelector:
    # Any Linux node may announce → Cilium leader-elects one and FAILS OVER if it dies. Previously
    # pinned to worker-1 (a SPOF: when worker-1/aether went down, every LB IP went dark with no
    # failover). Resilience > avoiding nahida congestion for lightweight ARP announcement.
    matchLabels:
      kubernetes.io/os: linux
