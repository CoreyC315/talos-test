apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cilium-hubble
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cilium-hubble.json: |
    {
      "uid": "cilium-hubble",
      "title": "Cilium / Hubble",
      "schemaVersion": 39,
      "tags": ["homelab", "network"],
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "1m",
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Flows/s by Verdict",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum by (verdict) (rate(hubble_flows_processed_total[5m]))", "legendFormat": "{{verdict}}"}
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Drops/s by Reason",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum by (reason) (rate(hubble_drop_total[5m]))", "legendFormat": "{{reason}}"}
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Cilium Endpoints by State",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum by (endpoint_state) (cilium_endpoint_state)", "legendFormat": "{{endpoint_state}}"}
          ]
        },
        {
          "id": 4, "type": "timeseries", "title": "HTTP Requests/s by Status (Hubble L7)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum by (status) (rate(hubble_http_requests_total[5m]))", "legendFormat": "{{status}}"}
          ]
        }
      ]
    }
