apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |
    {
      "uid": "cluster-overview",
      "title": "Cluster Overview",
      "schemaVersion": 39,
      "tags": ["homelab"],
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "1m",
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Node CPU Usage",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))", "legendFormat": "{{instance}}"}
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Node Memory Usage",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes", "legendFormat": "{{instance}}"}
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Node Disk Usage (root)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"}", "legendFormat": "{{instance}} {{mountpoint}}"}
          ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Running Pods",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "count(kube_pod_status_phase{phase=\"Running\"} == 1)", "legendFormat": "running pods"}
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Top 10 Pods by Memory",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\", pod!=\"\"}))", "legendFormat": "{{namespace}}/{{pod}}"}
          ]
        }
      ]
    }
