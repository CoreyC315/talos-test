apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - grafana.192.168.1.27.nip.io
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
