# Lives in kube-system: HTTPRoute backendRefs must be in the route's own
# namespace (hubble-ui runs in kube-system) unless a ReferenceGrant is used.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - hubble.192.168.1.27.nip.io
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
