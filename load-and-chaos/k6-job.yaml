# Run the load profile in-cluster: kubectl apply -f load-and-chaos/k6-job.yaml
# (script is injected from a ConfigMap created by run-load.sh; or run k6 locally)
apiVersion: v1
kind: Namespace
metadata:
  name: loadtest
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: loadtest
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: {app: k6-load}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: k6
          image: grafana/k6:1.4.0
          args: [run, /scripts/k6-load.js]
          env:
            # Through the Gateway on purpose: exercises the real path (TLS, HTTPRoute,
            # L7 policy) and keeps the kubeshowcase default-deny netpol untouched.
            - name: BASE_URL
              value: https://app.192.168.1.27.nip.io
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: k6-script}
        - name: tmp
          emptyDir: {}
