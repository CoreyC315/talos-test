# Gateway API route (this cluster uses Gateway API, not Ingress) → sonarr.192.168.1.27.nip.io.
# Replaces the homelab's nginx Ingress (sonarr.local/.lan). Attaches to the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true" # Gateway arrives in an earlier wave; don't gate
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - sonarr.192.168.1.27.nip.io
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
