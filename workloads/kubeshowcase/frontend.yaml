# ks-frontend: React SPA on nginx-unprivileged. This is the VPA InPlaceOrRecreate target
# (NOT HPA-managed — VPA and HPA must never share a CPU signal).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks-frontend
  namespace: kubeshowcase
  labels: {app: ks-frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ks-frontend}
  template:
    metadata:
      labels: {app: ks-frontend}
    spec:
      serviceAccountName: ks-frontend
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: ks-frontend}
      containers:
        - name: frontend
          image: 192.168.1.23:5000/ks-frontend:1.0.0
          ports:
            - {containerPort: 8080, name: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ks-frontend
  namespace: kubeshowcase
  labels: {app: ks-frontend}
spec:
  selector: {app: ks-frontend}
  ports:
    - {port: 8080, targetPort: http, name: http}
