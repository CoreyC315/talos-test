# Runtime secret delivery exhibit: ESO pulls from in-cluster Vault (kv2 kubeshowcase/api)
# into ks-vault-secret. Contrast with ks-sops-demo which is SOPS-encrypted IN Git.
# When to use which: SOPS = config-like secrets owned by Git reviewers, rotated via PR.
# ESO/Vault = runtime credentials owned by a secrets platform, rotated centrally without commits.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ks-vault-secret
  namespace: kubeshowcase
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: ks-vault-secret
    creationPolicy: Owner
  data:
    - secretKey: VAULT_MESSAGE
      remoteRef:
        key: api
        property: message
