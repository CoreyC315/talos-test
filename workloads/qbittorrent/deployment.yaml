apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media-dl
  labels: { app: qbittorrent }
spec:
  replicas: 1 # up on fresh ProtonVPN key
  selector:
    matchLabels: { app: qbittorrent }
  strategy:
    type: Recreate # single writer for qBittorrent.conf/fastresume on RWX-NFS
  template:
    metadata:
      labels: { app: qbittorrent }
    spec:
      containers:
        # --- GLUETUN: ProtonVPN WireGuard + auto-port-forward sync (replicated from the homelab) ---
        - name: gluetun
          image: qmcgaw/gluetun:latest # was v3.41.0 — latest ships a fresher ProtonVPN server list
          imagePullPolicy: Always
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "MKNOD"] # NET_ADMIN: tun/routing; MKNOD: create /dev/net/tun on Talos
          envFrom:
            - secretRef:
                name: protonvpn-secret # copied from the homelab cluster (WireGuard creds)
          env:
            - { name: VPN_PORT_FORWARDING, value: "on" }
            - { name: VPN_PORT_FORWARDING_PROVIDER, value: "protonvpn" }
            # runs whenever the VPN hands out a new forwarded port → pushes it into qbit's listen_port
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: "/bin/sh -c 'wget -qO- --post-data \"json={\\\"listen_port\\\":{{PORT}}}\" http://localhost:8080/api/v2/app/setPreferences'"
            - { name: HTTP_CONTROL_SERVER_ADDRESS, value: ":8000" }
            # Cilium/Talos: the homelab omitted these, but gluetun's firewall blocks non-VPN traffic by
            # default → without them the WebUI is unreachable and qbit can't reach in-cluster DNS/peers.
            - { name: FIREWALL_INPUT_PORTS, value: "8080" } # allow the WebUI in (Service/Gateway, sonarr)
            # NOTE: FIREWALL_OUTBOUND_SUBNETS removed — it conflicted with the ProtonVPN NAT-PMP gateway
            # (10.2.0.1) and broke port forwarding. WebUI inbound works via FIREWALL_INPUT_PORTS; qbit's
            # DNS/peers go through the tunnel, so it doesn't need outbound cluster access.
            # Cilium pod MTU is 1450; WireGuard adds ~60B overhead, so the default WG MTU (1400) drops
            # full-size packets → healthcheck (TLS/DNS) i/o timeouts → endless VPN restart loop → qbit
            # "firewalled". Pin WG MTU well under the underlay, and give the tunnel + ProtonVPN port-
            # forward negotiation time to settle before the healthcheck judges it.
            - { name: WIREGUARD_MTU, value: "1320" }
            - { name: HEALTH_VPN_DURATION_INITIAL, value: "30s" }
            # gluetun v3.41.0 embeds a Dec-2025 snapshot of ProtonVPN's servers (incl. each server's
            # WireGuard PUBLIC KEY). ProtonVPN rotates those keys, so 6 months later we encrypt
            # handshakes to dead keys → server never replies → tun0 tx>0/rx=0. Refresh the list at
            # runtime so the keys are current (keeps your pinned v3.41.0). Kernel WG is fine here.
            - { name: UPDATER_PERIOD, value: "24h" }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        # --- QBITTORRENT (shares gluetun's netns → all its traffic is killswitched through the VPN) ---
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest # was 5.1.4-r2-ls446
          imagePullPolicy: Always
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: "America/Detroit" }
            - { name: WEBUI_PORT, value: "8080" }
          ports:
            - { name: webui, containerPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: data
          persistentVolumeClaim:
            claimName: media-library
