# jellyfin storage — lives in the privileged `media-gpu` namespace (it needs /dev/dri + a privileged
# container for VAAPI hardware transcoding on the Vega iGPU passed to worker-1).
#
# config: static NFS PV at /volume1/appconfig/jellyfin (the migrated "Akasha" data — library DB,
#         users, watch history, metadata). Same fixed-path pattern as the other apps.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config-nfs
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-config-nfs
    volumeAttributes:
      server: 192.168.1.210
      share: /volume1/appconfig/jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media-gpu
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: jellyfin-config-nfs
  resources:
    requests:
      storage: 5Gi
---
# media: the SAME shared library the *arr apps manage (/volume1/media/pvc-7a5c8634-...). Sibling
# static PV (own volumeHandle, same share) since this lives in its own namespace. jellyfin reads it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-media-nfs
    volumeAttributes:
      server: 192.168.1.210
      share: /volume1/media/pvc-7a5c8634-4a2d-4938-a86c-6bd203e91067
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media-gpu
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: jellyfin-media-nfs
  resources:
    requests:
      storage: 1Ti
