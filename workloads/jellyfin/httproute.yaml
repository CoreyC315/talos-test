# Gateway API route → jellyfin.192.168.1.27.nip.io (replaces the homelab nginx Ingress).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media-gpu
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true" # Gateway arrives in an earlier wave; don't gate
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - jellyfin.192.168.1.27.nip.io
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
