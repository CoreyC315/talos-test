apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
  labels: { app: flaresolverr }
spec:
  replicas: 1
  selector:
    matchLabels: { app: flaresolverr }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: flaresolverr }
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.3.21 # ghcr.io already (Kyverno-allowed), same tag as homelab
          env:
            - { name: TZ, value: "America/Detroit" }
            - { name: LOG_LEVEL, value: "info" }
          ports:
            - { name: http, containerPort: 8191 }
          readinessProbe:
            tcpSocket: { port: 8191 } # universal probe (avoids per-app HTTP health paths)
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8191 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
