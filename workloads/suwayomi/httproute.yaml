# Gateway API route (this cluster uses Gateway API, not Ingress) → suwayomi.192.168.1.27.nip.io.
# Replaces the homelab's nginx Ingress (suwayomi.local/.lan). Attaches to the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: suwayomi
  namespace: media
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true" # Gateway arrives in an earlier wave; don't gate
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - suwayomi.192.168.1.27.nip.io
  rules:
    - backendRefs:
        - name: suwayomi
          port: 4567
