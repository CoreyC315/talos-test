# Static NFS PV → a FIXED path on the Synology (192.168.1.210:/volume1/appconfig/suwayomi) so the
# SAME config dir can be mounted by EITHER cluster. The k0s side will point its own static PV at this
# identical path → state is shared across a cluster switch (dual-cluster plan Phase 3). A fixed path
# (not the dynamic per-PVC subdir) is what makes the sharing deterministic.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: suwayomi-config-nfs
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # static binding (no dynamic provisioner)
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: suwayomi-config-nfs
    volumeAttributes:
      server: 192.168.1.210
      share: /volume1/appconfig/suwayomi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: suwayomi-config
  namespace: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: suwayomi-config-nfs # bind to the static PV above
  resources:
    requests:
      storage: 5Gi
