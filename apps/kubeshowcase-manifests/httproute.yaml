# Single hostname, path-split: /api -> Go API, everything else -> React SPA
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubeshowcase
  namespace: kubeshowcase
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - app.192.168.1.27.nip.io
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: Exact, value: /healthz}
        - path: {type: Exact, value: /readyz}
      backendRefs:
        - name: ks-api
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: ks-frontend
          port: 8080
