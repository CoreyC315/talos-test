apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.8.1
      helm:
        releaseName: kyverno
        valuesObject:
          # RAM-constrained tier: single replicas everywhere (3 workers, 14GB total)
          admissionController:
            replicas: 1
            container:
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 384Mi}
            initContainer:
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 128Mi}
          backgroundController:
            enabled: true
            replicas: 1
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {memory: 192Mi}
          cleanupController:
            enabled: true
            replicas: 1
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {memory: 192Mi}
          reportsController:
            enabled: true
            replicas: 1
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {memory: 192Mi}
    - repoURL: https://github.com/CoreyC315/talos-test.git
      targetRevision: main
      path: security/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
