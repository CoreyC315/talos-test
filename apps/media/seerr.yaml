apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6" # after the NFS CSI/storage layer (wave 2)
spec:
  project: default
  source:
    repoURL: https://github.com/CoreyC315/talos-test.git
    targetRevision: main
    path: workloads/seerr
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # jellyseerr starts as root then drops to PUID — baseline PSS allows that
        # (restricted would block the root start). No host access needed.
        pod-security.kubernetes.io/enforce: baseline
