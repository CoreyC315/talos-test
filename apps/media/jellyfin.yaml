apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6" # after the NFS CSI/storage layer
spec:
  project: default
  source:
    repoURL: https://github.com/CoreyC315/talos-test.git
    targetRevision: main
    path: workloads/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: media-gpu
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # jellyfin runs privileged for /dev/dri (VAAPI). Dedicated GPU namespace; the *arr apps stay
        # baseline in `media`, the VPN pod stays in `media-dl`.
        pod-security.kubernetes.io/enforce: privileged
