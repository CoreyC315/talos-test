apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/spegel-org/helm-charts
    chart: spegel
    targetRevision: 0.7.1
    helm:
      releaseName: spegel
      valuesObject:
        spegel:
          # Talos containerd paths (registries.mirrors in machine config point at hostPort 29999)
          containerdSock: /run/containerd/containerd.sock
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
          # ONLY mirror the public registries. Empty (the default) means "mirror ALL" via a
          # catch-all `_default` host config that ALSO intercepts the in-cluster registry
          # 192.168.1.23:5000 — Spegel can't proxy that plain-HTTP registry, so it 404s and app
          # image pulls fail (ErrImagePull "not found"). Listing only the public registries leaves
          # .23:5000 to its direct http mirror from the Talos machine config.
          mirroredRegistries:
            - https://docker.io
            - https://ghcr.io
            - https://registry.k8s.io
            - https://quay.io
          # PRESERVE the existing Talos registry config (kept in _backup) instead of replacing it,
          # and prepend Spegel only for the registries above. Without this, Spegel wipes the Talos
          # machine-config mirror for the in-cluster registry 192.168.1.23:5000 → ErrImagePull.
          prependExisting: true
        service:
          registry:
            hostPort: 29999
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 160Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: spegel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged # hostPort + containerd socket
