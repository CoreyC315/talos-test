apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/spegel-org/helm-charts
    chart: spegel
    targetRevision: 0.7.1
    helm:
      releaseName: spegel
      valuesObject:
        spegel:
          # Talos containerd paths (registries.mirrors in machine config point at hostPort 29999)
          containerdSock: /run/containerd/containerd.sock
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
          # ONLY mirror the public registries. Empty (the default) means "mirror ALL" via a
          # catch-all `_default` host config that ALSO intercepts the in-cluster registry
          # 192.168.1.23:5000 — Spegel can't proxy that plain-HTTP registry, so it 404s and app
          # image pulls fail (ErrImagePull "not found"). Listing only the public registries leaves
          # .23:5000 to its direct http mirror from the Talos machine config.
          mirroredRegistries:
            - https://docker.io
            - https://ghcr.io
            - https://registry.k8s.io
            - https://quay.io
            # In-cluster app registry (worker-1 hostPort, PLAIN HTTP). Spegel manages the whole
            # containerd hosts dir, so it must mirror this too — otherwise there is NO config for
            # it and pulls fail. With the http:// scheme Spegel writes `server = http://...:5000`
            # as the fallback after its p2p mirror, so a cache miss still resolves over HTTP.
            - http://192.168.1.23:5000
          # Keep existing Talos mirror entries (don't wipe them) and prepend Spegel's.
          prependExisting: true
        service:
          registry:
            hostPort: 29999
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 160Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: spegel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged # hostPort + containerd socket
