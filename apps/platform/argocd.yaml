# Argo CD manages itself: same chart+values as the bootstrap install, plus its HTTPRoute.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.5.21
      helm:
        releaseName: argocd
        valueFiles:
          - $values/bootstrap/argocd/values.yaml
    - repoURL: https://github.com/CoreyC315/talos-test.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/CoreyC315/talos-test.git
      targetRevision: main
      path: platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # never let self-management prune ArgoCD out from under itself
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
