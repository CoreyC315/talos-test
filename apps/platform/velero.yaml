# DR exhibit (Stretch tier): Velero -> in-cluster MinIO. Drill: backup kubeshowcase,
# delete the namespace, restore, verify data. Runbook: load-and-chaos/runbooks/dr-velero.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  sources:
    - repoURL: https://github.com/CoreyC315/talos-test.git
      targetRevision: main
      path: platform/velero
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.0.2
      helm:
        releaseName: velero
        valuesObject:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          initContainers:
            - name: velero-plugin-for-aws
              image: velero/velero-plugin-for-aws:v1.13.0
              volumeMounts:
                - mountPath: /target
                  name: plugins
          configuration:
            backupStorageLocation:
              - name: default
                provider: aws
                bucket: velero
                config:
                  region: homelab
                  s3ForcePathStyle: "true"
                  s3Url: http://minio.minio.svc.cluster.local:9000
            volumeSnapshotLocation: []
            features: EnableCSI
            defaultSnapshotMoveData: true
          credentials:
            existingSecret: velero-minio
          snapshotsEnabled: false
          deployNodeAgent: true
          nodeAgent:
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits: {memory: 256Mi}
          metrics:
            serviceMonitor:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged # node-agent mounts host pod volumes
