apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.0
      helm:
        releaseName: longhorn
        valuesObject:
          preUpgradeChecker:
            jobEnabled: false # helm-only hook breaks under ArgoCD (SA doesn't exist pre-sync)
          # I/O-budget reality: 1 replica (shared Proxmox disks; 2x write-amp starved etcd fsync)
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 1
          defaultSettings:
            defaultReplicaCount: 1
            defaultDataPath: /var/lib/longhorn
            guaranteedInstanceManagerCPU: 5
            # Volume backups go OFF-CLUSTER to the Synology NFS so they survive a full teardown
            # (the in-cluster MinIO is on Longhorn itself — useless for Longhorn's own DR).
            backupTarget: nfs://192.168.1.210:/volume1/backups/longhorn
            backupTargetCredentialSecret: ""
            concurrentReplicaRebuildPerNodeLimit: 2
          longhornUI:
            replicas: 1
          ingress:
            enabled: false # HTTPRoute instead
          resources:
            requests: {cpu: 50m, memory: 128Mi}
    - repoURL: https://github.com/CoreyC315/talos-test.git
      targetRevision: main
      path: platform/longhorn/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # Longhorn needs hostPath/privileged — explicitly privileged, documented in README
        pod-security.kubernetes.io/enforce: privileged
