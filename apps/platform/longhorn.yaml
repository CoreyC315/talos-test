apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.0
      helm:
        releaseName: longhorn
        valuesObject:
          preUpgradeChecker:
            jobEnabled: false # helm-only hook breaks under ArgoCD (SA doesn't exist pre-sync)
          # 2 replicas now that the workers are balanced one-per-host (raiden/aether/nahida)
          # and the co-tenant I/O contention is gone — replicas land on distinct hosts via
          # topology, so a single node/host loss no longer faults a volume (was Incident 5).
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 2
          defaultSettings:
            defaultReplicaCount: 2
            defaultDataPath: /var/lib/longhorn
            guaranteedInstanceManagerCPU: 5
            # Volume backups go OFF-CLUSTER to the Synology NFS so they survive a full teardown
            # (the in-cluster MinIO is on Longhorn itself — useless for Longhorn's own DR).
            # nfsOptions are load-bearing for Synology DSM (NFSv3-only export, no rpc.statd) —
            # see platform/longhorn/manifests/backuptarget.yaml for the full why. The BackupTarget
            # CR there is authoritative; this default just seeds the same URL pre-CR.
            backupTarget: nfs://192.168.1.210:/volume1/backups/longhorn?nfsOptions=nfsvers=3,nolock,soft,timeo=300,retry=2
            backupTargetCredentialSecret: ""
            concurrentReplicaRebuildPerNodeLimit: 2
          longhornUI:
            replicas: 1
          ingress:
            enabled: false # HTTPRoute instead
          resources:
            requests: {cpu: 50m, memory: 128Mi}
    - repoURL: https://github.com/CoreyC315/talos-test.git
      targetRevision: main
      path: platform/longhorn/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # Longhorn needs hostPath/privileged — explicitly privileged, documented in README
        pod-security.kubernetes.io/enforce: privileged
