apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must not run as root. runAsNonRoot must be set to true either
      at the pod securityContext level (with optional per-container overrides
      that may only be true) or on every container's securityContext.
spec:
  validationFailureAction: Audit # flip to Enforce later
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - longhorn-system
                - kyverno
                - falco
                - spegel
                - monitoring
                - argocd
                - cert-manager
                - minio
                - vault
                - external-secrets
                - trivy-system
                - gateway
      validate:
        message: >-
          Running as root is not allowed. Set runAsNonRoot: true in the pod
          securityContext or in every container securityContext.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
          - spec:
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true
