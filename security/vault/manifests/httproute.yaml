apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - vault.192.168.1.27.nip.io
  rules:
    - backendRefs:
        - name: vault
          port: 8200
